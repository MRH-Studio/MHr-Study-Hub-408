name: Build and Deploy MR.H Study Hub

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mrh-study-hub-deploy
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify and Prepare Existing Server Data Directory
        env:
          STORAGE_HOST_DIR: /home/mrh123/data/Project-1
        run: |
          set -eu
          for relative in \
            "courses/Basic of Computer" \
            "courses/Basic of C Programming" \
            "courses/Basic of Microsoft Excel" \
            "courses/Basic of Microsoft PowerPoint" \
            "courses/Basic of Microsoft Word" \
            "courses/Basic of Power BI" \
            "courses/Basic of Python" \
            "courses/Basic of SQL" \
            "Payments" \
            "Recipt"; do
            if [ ! -d "$STORAGE_HOST_DIR/$relative" ]; then
              echo "::error::Required existing data directory is missing: $STORAGE_HOST_DIR/$relative"
              exit 1
            fi
          done
          
          echo "Using existing persistent data directory: $STORAGE_HOST_DIR"

      - name: Build Docker Image
        run: |
          docker build --pull \
            -t mrh-study-hub:latest \
            -f Dockerfile/Dockerfile .

      - name: Verify Docker Image
        run: docker image inspect mrh-study-hub:latest

      - name: Validate Required Runtime Secrets
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB_NAME: ${{ secrets.MONGODB_DB_NAME }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_SESSION_SECRET: ${{ secrets.ADMIN_SESSION_SECRET }}
          STUDENT_SESSION_SECRET: ${{ secrets.STUDENT_SESSION_SECRET }}
        run: |
          set -eu
          for name in MONGODB_URI MONGODB_DB_NAME ADMIN_USERNAME ADMIN_PASSWORD ADMIN_SESSION_SECRET STUDENT_SESSION_SECRET; do
            value="${!name:-}"
            if [ -z "$value" ]; then
              echo "::error::Missing required GitHub Actions secret: $name"
              exit 1
            fi
          done

      - name: Stop Previous Study Hub
        run: |
          docker stop mrh-study-hub || true
          docker rm mrh-study-hub || true

      - name: Deploy Study Hub with Existing Persistent Data Directory
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB_NAME: ${{ secrets.MONGODB_DB_NAME }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_SESSION_SECRET: ${{ secrets.ADMIN_SESSION_SECRET }}
          STUDENT_SESSION_SECRET: ${{ secrets.STUDENT_SESSION_SECRET }}
          STORAGE_HOST_DIR: /home/mrh123/data/Project-1
        run: |
          set -eu
          docker run -d \
            --restart unless-stopped \
            --name mrh-study-hub \
            -p 1708:3000 \
            --mount "type=bind,source=$STORAGE_HOST_DIR,target=$STORAGE_HOST_DIR" \
            -e NODE_ENV=production \
            -e STORAGE_DIR="$STORAGE_HOST_DIR" \
            -e MONGODB_URI \
            -e MONGODB_DB_NAME \
            -e ADMIN_USERNAME \
            -e ADMIN_PASSWORD \
            -e ADMIN_SESSION_SECRET \
            -e STUDENT_SESSION_SECRET \
            mrh-study-hub:latest

      - name: Verify Deployment
        run: |
          set -eu
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:1708/api/admin > /dev/null; then
              echo "MR.H Study Hub is responding."
              docker ps --filter name=mrh-study-hub
              docker inspect mrh-study-hub --format '{{range .Mounts}}{{println .Source "->" .Destination}}{{end}}'
              exit 0
            fi
            sleep 3
          done
          echo "::error::Study Hub did not become healthy."
          docker logs --tail 100 mrh-study-hub
          exit 1
